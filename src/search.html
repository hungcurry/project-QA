<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRA 搜尋與篩選邏輯獨立展示</title>
  <!-- 引入 Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 自訂主題顏色配置 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#fef2f2',
              100: '#fee2e2',
              600: '#dc2626',
              700: '#b91c1c',
            }
          }
        }
      }
    }
  </script>
  <!-- 引入 FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<style>
  * {
    -webkit-tap-highlight-color: transparent;
  }

  .faq-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease-in-out, opacity 0.3s ease-in-out;
    opacity: 0;
  }

  .faq-answer.active {
    max-height: 800px;
    opacity: 1;
  }

  .rotate-icon {
    transition: transform 0.3s ease;
  }

  .active .rotate-icon {
    transform: rotate(180deg);
  }

  .faq-item {
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .faq-item:hover {
    border-color: rgba(220, 38, 38, 0.3);
  }

  .faq-item.active {
    border-color: #dc2626;
    background-color: #ffffff;
    box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.08), 0 8px 10px -6px rgba(220, 38, 38, 0.08);
  }

  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }

  .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  /* 分類按鈕共用基礎樣式 */
  .category-btn {
    background-color: #ffffff;
    color: #475569;
    border: 1px solid #e2e8f0;
  }

  .category-btn:hover {
    background-color: #f1f5f9;
  }

  /* 啟用狀態的樣式 */
  .category-btn.category-btn-active {
    background-color: #dc2626;
    color: #ffffff;
    border-color: transparent;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  }
</style>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans antialiased">

  <!-- 主內容區：專注於搜尋與篩選介面 -->
  <main class="max-w-4xl w-full mx-auto px-4 sm:px-6 py-10 flex-grow">
    <!-- 搜尋輸入框 -->
    <div class="relative max-w-xl mx-auto mb-6">
      <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
        <i class="fa-solid fa-magnifying-glass text-base"></i>
      </span>
      <input type="text" id="searchInput" placeholder="輸入關鍵字（例如：產品要求、SBOM、漏洞處理...）"
        class="w-full pl-11 pr-10 py-3 bg-white border border-slate-200 rounded-2xl shadow-xs focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600 text-sm sm:text-base text-slate-700 transition">
      <button id="clearSearch"
        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 hidden cursor-pointer">
        <i class="fa-solid fa-circle-xmark text-lg"></i>
      </button>
    </div>

    <!-- 分類標籤篩選容器 -->
    <div id="categoryFilters"
      class="flex items-center sm:justify-center gap-2 mb-6 overflow-x-auto no-scrollbar pb-2 px-1"></div>

    <!-- Q&A 列表清單 -->
    <div class="space-y-3 sm:space-y-4" id="faqList"></div>

    <!-- 分頁導航列 -->
    <div id="paginationContainer"
      class="flex flex-col sm:flex-row items-center justify-between gap-3 mt-8 pt-4 border-t border-slate-200/60 hidden">
      <div class="text-xs text-slate-500 text-center sm:text-left" id="paginationInfo">顯示第 1 - 10 筆，共 12 筆</div>
      <div class="flex items-center space-x-1.5" id="paginationButtons"></div>
    </div>

    <!-- 找不到結果提示 -->
    <div id="noResults" class="hidden text-center py-12">
      <div class="text-slate-300 text-4xl sm:text-5xl mb-3">
        <i class="fa-regular fa-face-frown"></i>
      </div>
      <h3 class="text-base sm:text-lg font-semibold text-slate-700">找不到相關的 CRA 規範解答</h3>
      <p class="text-slate-400 text-xs sm:text-sm mt-1">您可以嘗試更換關鍵字或重設分類條件。</p>
    </div>
  </main>

  <!-- 頁尾 -->
  <footer class="bg-white border-t border-slate-100 py-5 mt-10">
    <div class="max-w-4xl mx-auto px-4 text-center text-[11px] sm:text-xs text-slate-400">
      &copy; 2026 CRA 歐盟網路韌性法案諮詢中心. All rights reserved.
    </div>
  </footer>


</body>

<!-- JavaScript 互動邏輯 -->
<script type="module">
  import { fetchAllData, getFaqs, getCategories } from '../store/useFetchStore.js'

  // 搜尋與篩選邏輯
  const searchInput = document.getElementById('searchInput');
  const clearSearchBtn = document.getElementById('clearSearch');
  const categoryFilters = document.getElementById('categoryFilters');
  const faqList = document.getElementById('faqList');
  let faqData = [];
  let filterData = [];
  let currentCategory = 'all';
  let categoryData = [];

  // ===================
  // ... Data ...
  // ===================
  // computed 篩選 
  function getFilterData() {
    const keyword = searchInput.value.toLowerCase().trim();// 轉成小寫
    filterData = faqData.filter(item => {
      // 條件 A：分類有沒有符合？
      const matchesCategory = (currentCategory === 'all' || item.category === currentCategory);

      // 條件 B：關鍵字有沒有符合？
      // 檢查「問題」或「答案」之中是否包含關鍵字
      const matchesKeyword = (item.question.toLowerCase().includes(keyword) || item.answer.toLowerCase().includes(keyword));
      // 回傳 true 代表保留這筆資料，false 代表過濾掉
      const iskeep = matchesCategory && matchesKeyword;
      return iskeep;
    });
    // console.log(`filterData`, filterData);
  }

  // ===================
  // ... Render ...
  // ===================
  // 渲染 分類按鈕 畫面
  function renderCategories() {
    const container = document.getElementById('categoryFilters');
    container.innerHTML = '';

    categoryData.forEach(item => {
      const isActive = item.category === currentCategory;

      const btnHtml = `
      <button
        data-category="${item.category}"
        class="category-btn ${isActive ? 'category-btn-active' : ''} shrink-0 px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all cursor-pointer"
      >
        ${item.label}
      </button>
    `;

      container.insertAdjacentHTML('beforeend', btnHtml);
    });
  }
  // 渲染 Q&A 畫面
  function renderFaqs() {
    if (!faqData || faqData.length === 0) return;
    getFilterData(); // 先取得篩選後的資料

    const keyword = searchInput.value.trim();
    const faqListEl = document.getElementById('faqList');
    const noResultsDiv = document.getElementById('noResults');

    faqListEl.innerHTML = '';

    if (filterData.length === 0) {
      noResultsDiv.classList.remove('hidden');
      document.getElementById('paginationContainer').classList.add('hidden');
      return;
    }

    noResultsDiv.classList.add('hidden');

    // 透過共用函式取得當前頁面資料片段
    const { pageData } = getPaginationState();

    // 渲染當前頁面的資料
    pageData.forEach((item) => {
      const highlightedQuestion = highlightText(item.question, keyword);
      const highlightedAnswer = highlightText(item.answer, keyword);

      const itemHtml = `
        <div class="faq-item bg-white border border-slate-200/80 rounded-2xl shadow-xs overflow-hidden transition-all" data-category="${item.category}">
          <button class="faq-question w-full px-4 sm:px-6 py-3.5 sm:py-4 text-left flex items-center justify-between focus:outline-none cursor-pointer">
            <span class="font-semibold text-slate-800 text-sm sm:text-base flex items-center gap-2.5 pr-2 leading-snug">
              <span class="w-2 h-2 rounded-full bg-red-500 shrink-0"></span>
              <span>Q：</span>
              ${highlightedQuestion}
            </span>
            <i class="fa-solid fa-chevron-down text-slate-400 rotate-icon shrink-0"></i>
          </button>
          <div class="faq-answer px-4 sm:px-6 pb-4 sm:pb-5 text-slate-600 text-sm sm:text-base leading-relaxed border-t border-slate-100 pt-3">
            ${highlightedAnswer}
          </div>
        </div>
      `;
      faqListEl.insertAdjacentHTML('beforeend', itemHtml);
    });

    // 每次渲染完列表後，一併更新分頁按鈕狀態
    renderPagination();
  }
  // 關鍵字高亮
  function highlightText(text, keyword) {
    if (!keyword) return text;
    const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${escaped})`, 'gi');
    return text.replace(regex, '<span class="bg-primary-50 text-primary-700 font-semibold px-1 rounded">$1</span>');
  }

  // ===================
  // ... Events ...
  // ===================
  // 分類篩選事件
  function handleCategoryFilter(e) {
    const btn = e.target.closest('.category-btn');
    if (!btn) return;

    currentCategory = btn.dataset.category;
    currentPage = 1; // 切換分類時重置回第一頁
    renderCategories();
    renderFaqs();
  }
  // 搜尋事件
  function handleSearch(e) {
    const value = e.target.value.trim();
    clearSearchBtn.classList.toggle('hidden', value.length === 0);
    currentPage = 1; // 搜尋時重置回第一頁
    renderFaqs();
  }
  // 清除搜尋事件
  function handleClearSearch() {
    searchInput.value = '';
    clearSearchBtn.classList.add('hidden');
    currentPage = 1; // 清除搜尋時重置回第一頁
    renderFaqs();
    searchInput.focus();
  }
  // 展開收合事件
  function handleAccordion(e) {
    const questionBtn = e.target.closest('.faq-question');
    if (!questionBtn) return;

    const item = questionBtn.closest('.faq-item');
    const answerDiv = item.querySelector('.faq-answer');
    const isActive = item.classList.contains('active');

    // 全部關閉
    faqList.querySelectorAll('.faq-item').forEach(item => {
      item.classList.remove('active');
      item.querySelector('.faq-answer').classList.remove('active');
    });

    // 如果原本是關閉的，就打開目前這個
    if (!isActive) {
      item.classList.add('active');
      answerDiv.classList.add('active');
    }
  }

  categoryFilters.addEventListener('click', handleCategoryFilter);
  searchInput.addEventListener('input', handleSearch);
  clearSearchBtn.addEventListener('click', handleClearSearch);
  faqList.addEventListener('click', handleAccordion);

  // ===================
  // ... Pagination ...
  // ===================
  let currentPage = 1;
  const dataNum = 10;  // 取幾筆資料
  const paginationContainer = document.getElementById('paginationContainer');
  const paginationInfoEl = document.getElementById('paginationInfo');
  const paginationButtonsEl = document.getElementById('paginationButtons');

  // 取得分頁計算狀態
  function getPaginationState() {
    // Math.ceil(13 / 10) 等於 Math.ceil(1.3)，無條件進位後得到 totalPages = 2
    const totalPages = Math.ceil(filterData.length / dataNum);
    // 防呆: 大於頁數降回最後一頁,小於頁數返回第一頁
    if (currentPage > totalPages) currentPage = totalPages || 1;

    const startIndex = (currentPage - 1) * dataNum;
    const endIndex = Math.min(startIndex + dataNum, filterData.length);

    const pageData = filterData.slice(startIndex, endIndex);
    // 確保你的結束索引永遠不會超出陣列的最大長度 13
    // 在第 1 頁時：Math.min(10, 13) 取比較小的 10。
    // 在第 2 頁時：Math.min(20, 13) 取比較小的 13（而不是超出範圍的 20）
    // -----
    // 第 1 頁時 (currentPage = 1)
    // startIndex = (1 - 1) * 10 => 0
    // endIndex = Math.min(0 + 10, 13) => 取最小值 10
    // filterData.slice(0, 10) 抓 1-10 筆資料
    // -----
    // 第 2 頁時 (currentPage = 2)
    // startIndex = (2 - 1) * 10 => 10
    // endIndex = Math.min(10 + 10, 13) => 取最小值 13
    // filterData.slice(10, 13) 抓 11-13 筆資料

    return { totalPages, startIndex, endIndex, pageData };
  }

  function renderPagination() {
    const { totalPages, startIndex, endIndex, pageData } = getPaginationState();

    if (filterData.length > dataNum) {
      paginationContainer.classList.remove('hidden');
      paginationInfoEl.textContent = `顯示第 ${startIndex + 1} - ${endIndex} 筆，共 ${filterData.length} 筆`;
      renderButtons(totalPages);
    } else {
      paginationContainer.classList.add('hidden');
    }
  }

  function renderButtons(totalPages) {
    const container = document.getElementById('paginationButtons');
    container.innerHTML = '';

    const prevDisabled = currentPage === 1;
    container.insertAdjacentHTML('beforeend', `
        <button data-page="${currentPage - 1}" ${prevDisabled ? 'disabled' : ''}
          class="pagination-btn px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
          <i class="fa-solid fa-chevron-left text-[10px]"></i>
        </button>
      `);

    for (let i = 1; i <= totalPages; i++) {
      const active = i === currentPage;
      container.insertAdjacentHTML('beforeend', `
          <button data-page="${i}"
            class="pagination-btn px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors cursor-pointer ${active ? 'bg-red-600 text-white border-red-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
            ${i}
          </button>
        `);
    }

    const nextDisabled = currentPage === totalPages;
    container.insertAdjacentHTML('beforeend', `
        <button data-page="${currentPage + 1}" ${nextDisabled ? 'disabled' : ''}
          class="pagination-btn px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
          <i class="fa-solid fa-chevron-right text-[10px]"></i>
        </button>
      `);
  }

  // 分頁按鈕事件
  function handlePagination(e) {
    const btn = e.target.closest('.pagination-btn');
    if (!btn || btn.disabled) return;

    const targetPage = Number(btn.dataset.page);
    if (targetPage && targetPage !== currentPage) {
      changePage(targetPage);
    }
  }

  function changePage(page) {
    currentPage = page;
    renderFaqs(); // 裡面會包含切片渲染並會重新整理分頁按鈕
    window.scrollTo({ top: 200, behavior: 'smooth' });
  }

  paginationButtonsEl.addEventListener('click', handlePagination);

  // init
  async function initialize() {
    // data
    await fetchAllData()
    faqData = getFaqs()
    categoryData = getCategories()

    // render
    renderFaqs();
    renderCategories();
  }

  // 初始化渲染
  initialize();
</script>

</html>
